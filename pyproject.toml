[project]
name = "aiprog-lab-starter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "matplotlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
