[project]
name = "pipeline"
version = "0.1.0"
description = "Field-study measurement cleaning and reporting pipeline"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "matplotlib",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]
