[project]
name = "aiprog-lab-starter"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "matplotlib",
    "tabulate",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
pipeline = "pipeline.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pipeline"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pandas-stubs>=3.0.5.260730",
    "pytest>=9.1.1",
]
